# Credentials Configuration (Example)
# Copy this file to credentials.yml and fill in your actual credentials
# IMPORTANT: Never commit credentials.yml to git!

# AWS S3
aws:
  access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
  secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
  region: "us-east-1"

# Azure Blob Storage
azure:
  account_name: "YOUR_AZURE_STORAGE_ACCOUNT"
  account_key: "YOUR_AZURE_STORAGE_KEY"
  # Alternative: use SAS token
  sas_token: "YOUR_SAS_TOKEN"

# Databricks
databricks:
  host: "https://your-workspace.cloud.databricks.com"
  token: "YOUR_DATABRICKS_TOKEN"
  cluster_id: "YOUR_CLUSTER_ID"

# DENODO
denodo:
  dsn: "YOUR_DENODO_DSN"
  user: "YOUR_DENODO_USER"
  password: "YOUR_DENODO_PASSWORD"
  database: "treasury_data"

# Azure ML (for cloud deployment)
azureml:
  subscription_id: "YOUR_AZURE_SUBSCRIPTION_ID"
  resource_group: "YOUR_RESOURCE_GROUP"
  workspace_name: "YOUR_WORKSPACE_NAME"
  tenant_id: "YOUR_TENANT_ID"

# SageMaker (for cloud deployment)
sagemaker:
  role_arn: "arn:aws:iam::YOUR_ACCOUNT:role/SageMakerExecutionRole"
  bucket: "your-sagemaker-bucket"

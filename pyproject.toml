[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-forecast"
version = "1.0.0"
description = "Hubble.AI - Treasury Cash-Flow Forecasting Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aperam Treasury Analytics", email = "treasury@aperam.com"}
]
keywords = ["forecasting", "treasury", "cash-flow", "time-series", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core data handling
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",

    # Machine learning - tree-based
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",

    # Machine learning - deep learning
    "tensorflow>=2.13.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "tensorflow-macos>=2.13.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "torch>=2.0.0",

    # Time series
    "statsmodels>=0.14.0",

    # Data validation
    "pydantic>=2.0.0",

    # Configuration & logging
    "pyyaml>=6.0",
    "structlog>=23.1.0",
    "python-dotenv>=1.0.0",

    # Utilities
    "joblib>=1.3.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",

    # Cloud storage backends
    "boto3>=1.28.0",  # AWS S3
    "azure-storage-blob>=12.17.0",  # Azure Blob
    "azure-identity>=1.13.0",
    "databricks-sql-connector>=2.8.0",  # Databricks
    "pyodbc>=4.0.39",  # DENODO/SQL

    # Web UI
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "altair>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.7.0",
    "ruff>=0.0.282",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
]

azure = [
    "azureml-core>=1.51.0",
    "azureml-pipeline>=1.51.0",
]

sagemaker = [
    "sagemaker>=2.170.0",
]

dq = [
    "great-expectations>=0.17,<2"
]

[project.scripts]
cf-forecast = "cf_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=cf_forecast",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "leakage: marks tests that check for data leakage",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "xgboost.*",
    "statsmodels.*",
    "great_expectations.*",
]
ignore_missing_imports = true
